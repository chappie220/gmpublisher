name: build

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_linux:
    # Oldest supported Ubuntu LTS runner = oldest glibc, so the binaries also run on older distros.
    # Tauri 2 uses webkit2gtk-4.1 (libsoup3), which is what current Fedora/Ubuntu/Debian/Arch ship.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            zip

    - name: Install NPM dependencies
      run: npm install

    - name: Build
      run: npm run tauri build -- --bundles deb,rpm -v

    - name: Prepare ZIP
      run: |
        cd src-tauri/target/release

        # Desktop integration (launcher, .gma MIME type, Dolphin service menu), laid out like ~/.local/share
        install -Dm644 ../../linux/gmpublisher.desktop share/applications/gmpublisher.desktop
        install -Dm644 ../../linux/gmpublisher-mime.xml share/mime/packages/gmpublisher.xml
        install -Dm644 ../../linux/gmpublisher-servicemenu.desktop share/kio/servicemenus/gmpublisher.desktop
        install -Dm644 ../../icons/32x32.png share/icons/hicolor/32x32/apps/gmpublisher.png
        install -Dm644 ../../icons/128x128.png share/icons/hicolor/128x128/apps/gmpublisher.png
        install -Dm644 ../../icons/128x128@2x.png share/icons/hicolor/256x256/apps/gmpublisher.png

        # libsteam_api.so is found next to the executable through its $ORIGIN rpath (see build.rs)
        zip -r gmpublisher_linux64.zip gmpublisher libsteam_api.so share

    - uses: actions/upload-artifact@v4
      with:
        name: gmpublisher_linux64
        path: |
          src-tauri/target/release/gmpublisher_linux64.zip
          src-tauri/target/release/bundle/deb/*.deb
          src-tauri/target/release/bundle/rpm/*.rpm

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          src-tauri/target/release/gmpublisher_linux64.zip
          src-tauri/target/release/bundle/deb/*.deb
          src-tauri/target/release/bundle/rpm/*.rpm
        fail_on_unmatched_files: true

  test_fedora:
    # Installs the RPM on the latest Fedora and checks that every shared library resolves
    runs-on: ubuntu-latest
    needs: build_linux
    container: registry.fedoraproject.org/fedora:latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: gmpublisher_linux64

    # The artifact's root is src-tauri/target/release
    - name: Install RPM
      run: dnf install -y ./bundle/rpm/*.rpm

    - name: Check shared libraries
      run: |
        ldd /usr/bin/gmpublisher
        if ldd /usr/bin/gmpublisher | grep "not found"; then exit 1; fi

    - name: Smoke test
      run: gmpublisher --version

    - name: Check desktop integration
      run: |
        dnf install -y desktop-file-utils shared-mime-info
        desktop-file-validate /usr/share/applications/gmpublisher.desktop
        test -f /usr/share/kio/servicemenus/gmpublisher.desktop
        update-mime-database /usr/share/mime
        grep -qx application/x-gma /usr/share/mime/types
        update-desktop-database /usr/share/applications
        grep -q '^application/x-gma=.*gmpublisher.desktop;' /usr/share/applications/mimeinfo.cache

  build_windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2

    - name: Install NPM dependencies
      run: npm install

    - name: Build
      run: npm run tauri build -- -v
      env:
        RUSTFLAGS: -Ctarget-feature=+crt-static

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: src-tauri/target/release/bundle/msi/gmpublisher_*.msi
        fail_on_unmatched_files: true

  build_macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2

    - name: Install Rust targets
      run: |
        mkdir -p /tmp/rust-toolchain-plz
        cp src-tauri/rust-toolchain.toml /tmp/rust-toolchain-plz/
        cd /tmp/rust-toolchain-plz
        cargo init --lib
        cargo check
        rustup target add x86_64-apple-darwin

    - uses: actions/setup-node@v2

    - name: Install NPM dependencies
      run: npm install

    - name: Build
      run: npm run tauri build -- --target universal-apple-darwin -v

    - name: Copy Steamworks SDK to bundle
      run: cp src-tauri/lib/steam_api/redistributable_bin/osx/libsteam_api.dylib src-tauri/target/universal-apple-darwin/release/bundle/macos/gmpublisher.app/Contents/MacOS/libsteam_api.dylib

    - name: Prepare ZIP
      run: |
        cd src-tauri/target/universal-apple-darwin/release/bundle/macos
        zip -r gmpublisher_macOS.app.zip gmpublisher.app

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: src-tauri/target/universal-apple-darwin/release/bundle/macos/gmpublisher_macOS.app.zip
        fail_on_unmatched_files: true

  aur_publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build_linux, test_fedora]
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Update PKGBUILD Version and Checksums
        run: |
          VERSION=${{ github.ref_name }}

          echo "Updating PKGBUILD to version $VERSION"

          pacman -Sy --noconfirm pacman-contrib

          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          useradd -m builder
          chown -R builder:builder .

          su builder -c "updpkgsums"
          su builder -c "makepkg --printsrcinfo > .SRCINFO"

      - name: Publish AUR Package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: gmpublisher-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to version ${{ github.ref_name }}"
          updpkgsums: false
